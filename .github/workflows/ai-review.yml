# AI review of pull requests with Open Code Review and Mistral Large.
# Copy to .github/workflows/ai-review.yml. The logic lives in internal/ai-review on our GitLab;
# this file only checks out the pull request, downloads the scripts and runs them.
#
# Organization (or repository) settings:
#   secrets   MISTRAL_API_KEY      dedicated key, with a monthly spending limit on the Mistral console
#             AI_REVIEW_KIT_TOKEN  read-only deploy token of internal/ai-review
#   variables AI_REVIEW_USERS      authors reviewed automatically, comma separated
#             AI_REVIEW_GATE       optional, "true" makes the check fail unless the verdict is READY
#
# It reviews when a pull request from a branch of this repository by one of AI_REVIEW_USERS is
# opened or marked ready, and when someone with write access adds the label "ai-review" (also for
# forks; remove the label and add it again to review after new pushes). The pull request code is
# only checked out and read, never built or executed.
name: AI review
on:
  pull_request_target:
    types: [opened, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      !github.event.pull_request.draft && (
        (github.event.action != 'labeled' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         contains(format(',{0},', vars.AI_REVIEW_USERS), format(',{0},', github.event.pull_request.user.login))) ||
        (github.event.action == 'labeled' && github.event.label.name == 'ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Review
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KIT_TOKEN: ${{ secrets.AI_REVIEW_KIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_GATE: ${{ vars.AI_REVIEW_GATE }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1 "https://ai-review:${KIT_TOKEN}@gitlab.strumenta-ops.com/internal/ai-review.git" kit
          kit/scripts/github-entry.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
