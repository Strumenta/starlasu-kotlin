# Copy to .github/workflows/ai-review.yml. Needs the secret MISTRAL_API_KEY (organization or
# repository) and, for automatic reviews, the variable AI_REVIEW_USERS. See Strumenta/ai-review.
name: AI review
on:
  pull_request_target:
    types: [opened, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    uses: Strumenta/ai-review/.github/workflows/review.yml@v1
    secrets: inherit
