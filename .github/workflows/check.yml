name: Build and Test

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    name: Java ${{ matrix.Java }} BuildAndTest

    steps:
    - uses: actions/checkout@v5
    - name: Setup java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Check Java version
      run: java -version
    - name: Test
      run: ./gradlew check
